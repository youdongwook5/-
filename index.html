<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>3D Arena - Mina Style</title>


<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #111827;

    font-family:
        Arial,
        sans-serif;

    user-select: none;
}


#game {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

}


/* =====================================================
   UI
===================================================== */

#ui {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

}


/* =====================================================
   HP 패널
===================================================== */

#topUI {

    position: absolute;

    top: 18px;

    left: 18px;
    right: 18px;

    display: flex;

    justify-content:
        space-between;

}


.statusPanel {

    width: 250px;

    padding: 12px 15px;

    color: white;

    background:
        rgba(0,0,0,.48);

    border-radius: 14px;

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(6px);

    text-shadow:
        0 2px 4px black;

}


.hpBackground {

    width: 100%;
    height: 20px;

    margin-top: 6px;

    overflow: hidden;

    background: #222;

    border:
        2px solid
        rgba(255,255,255,.8);

    border-radius: 20px;

}


.hpBar {

    width: 100%;
    height: 100%;

    transition:
        width .12s;
}


#playerHPBar {

    background:
        linear-gradient(
            90deg,
            #22c55e,
            #84cc16
        );

}


#enemyHPBar {

    background:
        linear-gradient(
            90deg,
            #ef4444,
            #f97316
        );

}


.hpText {

    margin-top: 4px;

    font-size: 13px;

}


/* =====================================================
   조작 설명
===================================================== */

#controls {

    position: absolute;

    left: 18px;
    bottom: 18px;

    color: white;

    padding: 12px 15px;

    border-radius: 13px;

    background:
        rgba(0,0,0,.48);

    line-height: 1.55;

    text-shadow:
        0 2px 4px black;

}


/* =====================================================
   공격 상태
===================================================== */

#attackPanel {

    position: absolute;

    right: 18px;
    bottom: 18px;

    min-width: 210px;

    padding: 13px 16px;

    color: white;

    text-align: right;

    background:
        rgba(0,0,0,.48);

    border-radius: 13px;

    line-height: 1.55;

    text-shadow:
        0 2px 4px black;

}


#attackName {

    font-size: 21px;

}


#comboTimer {

    font-weight: bold;

}


/* =====================================================
   조준점
===================================================== */

#crosshair {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,.7);

    border-radius: 50%;

}


#crosshair::before {

    content: "";

    position: absolute;

    left: 12px;
    top: -5px;

    width: 2px;
    height: 38px;

    background:
        rgba(255,255,255,.6);

}


#crosshair::after {

    content: "";

    position: absolute;

    left: -5px;
    top: 12px;

    width: 38px;
    height: 2px;

    background:
        rgba(255,255,255,.6);

}


/* =====================================================
   승패
===================================================== */

#gameMessage {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background:
        rgba(0,0,0,.62);

    color: white;

    font-size: 65px;

    font-weight: bold;

    text-shadow:
        0 5px 15px black;

}


#restartText {

    margin-top: 15px;

    font-size: 18px;

    font-weight: normal;

}


</style>

</head>


<body>


<div id="game"></div>


<div id="ui">


    <!-- HP -->

    <div id="topUI">


        <div class="statusPanel">

            <b>미나</b>

            <div class="hpBackground">

                <div
                    id="playerHPBar"
                    class="hpBar"
                ></div>

            </div>

            <div
                id="playerHPText"
                class="hpText"
            >
                10000 / 10000
            </div>

        </div>


        <div class="statusPanel">

            <b>적 AI</b>

            <div class="hpBackground">

                <div
                    id="enemyHPBar"
                    class="hpBar"
                ></div>

            </div>

            <div
                id="enemyHPText"
                class="hpText"
            >
                10000 / 10000
            </div>

        </div>


    </div>


    <!-- 조준점 -->

    <div id="crosshair"></div>


    <!-- 조작 -->

    <div id="controls">

        <b>조작</b><br>

        WASD : 이동<br>

        마우스 : 조준<br>

        왼쪽 클릭 : 공격 + 대시

    </div>


    <!-- 공격 -->

    <div id="attackPanel">

        현재 공격<br>

        <b id="attackName">
            👟 신발
        </b>

        <br>

        다음 공격 :
        <span id="nextAttack">
            🪘 탬버린
        </span>

        <br>

        연계 :
        <span id="comboTimer">
            준비
        </span>

    </div>


    <!-- 승패 -->

    <div id="gameMessage">

        <div id="messageTitle">
            승리!
        </div>

        <div id="restartText">
            R 키를 눌러 다시 시작
        </div>

    </div>


</div>



<script type="importmap">

{

    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"

    }

}

</script>



<script type="module">


import * as THREE
    from "three";


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x172235
    );


scene.fog =
    new THREE.Fog(
        0x172235,
        35,
        95
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        .1,

        200

    );


camera.position.set(
    0,
    17,
    17
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.setSize(

    window.innerWidth,
    window.innerHeight

);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

const hemisphere =
    new THREE.HemisphereLight(

        0xffffff,

        0x202030,

        2.3

    );


scene.add(
    hemisphere
);


const directional =
    new THREE.DirectionalLight(

        0xffffff,

        3.2

    );


directional.position.set(
    12,
    25,
    10
);


directional.castShadow =
    true;


directional.shadow.mapSize.width =
    2048;


directional.shadow.mapSize.height =
    2048;


directional.shadow.camera.left =
    -40;


directional.shadow.camera.right =
    40;


directional.shadow.camera.top =
    40;


directional.shadow.camera.bottom =
    -40;


scene.add(
    directional
);


/* =====================================================
   바닥
===================================================== */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            75,
            75
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x34495e,

            roughness:
                .82

        })

    );


floor.rotation.x =
    -Math.PI / 2;


floor.receiveShadow =
    true;


scene.add(
    floor
);


/* =====================================================
   바닥 격자
===================================================== */

const grid =
    new THREE.GridHelper(

        75,
        37,

        0x72869b,
        0x45596b

    );


grid.position.y =
    .015;


scene.add(
    grid
);


/* =====================================================
   경기장 테두리
===================================================== */

function makeWall(
    x,
    z,
    sx,
    sz
) {

    const wall =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                2.5,
                sz
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x202b3a,

                roughness:
                    .75

            })

        );


    wall.position.set(
        x,
        1.25,
        z
    );


    wall.castShadow =
        true;


    wall.receiveShadow =
        true;


    scene.add(
        wall
    );

}


makeWall(
    0,
    -36,
    75,
    1
);


makeWall(
    0,
    36,
    75,
    1
);


makeWall(
    -36,
    0,
    1,
    75
);


makeWall(
    36,
    0,
    1,
    75
);


/* =====================================================
   장애물
===================================================== */

const obstacles = [];


function createObstacle(
    x,
    z,
    width,
    depth,
    height = 2.4
) {

    const obstacle =
        new THREE.Mesh(

            new THREE.BoxGeometry(

                width,
                height,
                depth

            ),

            new THREE.MeshStandardMaterial({

                color:
                    0x637588,

                roughness:
                    .7

            })

        );


    obstacle.position.set(

        x,
        height / 2,
        z

    );


    obstacle.castShadow =
        true;


    obstacle.receiveShadow =
        true;


    scene.add(
        obstacle
    );


    obstacles.push(
        obstacle
    );

}


/* 경기장 장애물 */

createObstacle(
    -10,
    -3,
    5,
    2.5
);


createObstacle(
    10,
    -2,
    5,
    2.5
);


createObstacle(
    -7,
    9,
    3,
    3
);


createObstacle(
    7,
    9,
    3,
    3
);


createObstacle(
    0,
    -7,
    5,
    2.5
);


/* =====================================================
   플레이어 그룹
===================================================== */

const player =
    new THREE.Group();


scene.add(
    player
);


player.position.set(
    0,
    0,
    12
);


/* =====================================================
   재질
===================================================== */

const skinMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xc98264,

        roughness:
            .65

    });


const purpleMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x7137d5,

        roughness:
            .6

    });


const purpleDarkMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x382064,

        roughness:
            .75

    });


const yellowMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xf2bd25,

        roughness:
            .7

    });


const whiteMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xf3efe5,

        roughness:
            .8

    });


const pinkMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xe83b99,

        roughness:
            .6

    });


const greenMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x20c59d,

        roughness:
            .55

    });


const blackMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x171923,

        roughness:
            .7

    });


const yellowGoldMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0xffd329,

        metalness:
            .15,

        roughness:
            .45

    });


/* =====================================================
   3D 캐릭터 함수
===================================================== */


/* -----------------------------
   몸통
----------------------------- */

const torso =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .67,
            1.0,
            8,
            18
        ),

        yellowMaterial

    );


torso.position.set(
    0,
    1.65,
    0
);


torso.scale.set(
    1,
    1,
    .7
);


torso.castShadow =
    true;


player.add(
    torso
);


/* -----------------------------
   목
----------------------------- */

const neck =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .22,
            .25,
            .28,
            16
        ),

        skinMaterial

    );


neck.position.set(
    0,
    2.35,
    0
);


neck.castShadow =
    true;


player.add(
    neck
);


/* =====================================================
   머리
===================================================== */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .68,
            32,
            24
        ),

        skinMaterial

    );


head.position.set(
    0,
    2.95,
    0
);


head.scale.set(
    1,
    1.05,
    .88
);


head.castShadow =
    true;


player.add(
    head
);


/* =====================================================
   머리카락
===================================================== */

const hairBack =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .73,
            24,
            20
        ),

        purpleDarkMaterial

    );


hairBack.position.set(
    0,
    3.02,
    .15
);


hairBack.scale.set(
    1,
    1,
    .7
);


hairBack.castShadow =
    true;


player.add(
    hairBack
);


/* -----------------------------
   양쪽 머리카락
----------------------------- */

function createHairSide(
    x
) {

    const hair =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .19,
                .72,
                8,
                12
            ),

            purpleDarkMaterial

        );


    hair.position.set(
        x,
        2.55,
        -.05
    );


    hair.rotation.z =
        x > 0
        ? -.35
        : .35;


    hair.castShadow =
        true;


    player.add(
        hair
    );


    return hair;

}


createHairSide(
    -.52
);


createHairSide(
    .52
);


/* =====================================================
   모자
===================================================== */

const hatMain =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .77,
            32,
            20
        ),

        purpleMaterial

    );


hatMain.position.set(
    0,
    3.45,
    .02
);


hatMain.scale.set(
    1.04,
    .57,
    .95
);


hatMain.castShadow =
    true;


player.add(
    hatMain
);


/* =====================================================
   모자 앞 챙
===================================================== */

const hatBrim =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.25,
            .12,
            .42
        ),

        purpleMaterial

    );


hatBrim.position.set(
    0,
    3.28,
    -.57
);


hatBrim.rotation.x =
    -.12;


hatBrim.castShadow =
    true;


player.add(
    hatBrim
);


/* =====================================================
   모자 노란 장식
===================================================== */

const hatBadge =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .38,
            .18,
            .08
        ),

        yellowGoldMaterial

    );


hatBadge.position.set(
    0,
    3.52,
    -.76
);


hatBadge.rotation.z =
    -.08;


player.add(
    hatBadge
);


/* =====================================================
   눈
===================================================== */

function createEye(
    x
) {

    const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .19,
                20,
                16
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffffff,

                roughness:
                    .35

            })

        );


    eye.position.set(
        x,
        3.03,
        -.58
    );


    eye.scale.set(
        .8,
        1.15,
        .5
    );


    eye.castShadow =
        true;


    player.add(
        eye
    );


    /* 동공 */

    const pupil =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .075,
                16,
                12
            ),

            blackMaterial

        );


    pupil.position.set(
        x,
        3.03,
        -.68
    );


    player.add(
        pupil
    );

}


createEye(
    -.22
);


createEye(
    .22
);


/* =====================================================
   눈썹
===================================================== */

function createEyebrow(
    x,
    rotation
) {

    const brow =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .055,
                .25,
                6,
                8
            ),

            blackMaterial

        );


    brow.position.set(
        x,
        3.32,
        -.59
    );


    brow.rotation.z =
        rotation;


    player.add(
        brow
    );

}


createEyebrow(
    -.22,
    -.25
);


createEyebrow(
    .22,
    .25
);


/* =====================================================
   코
===================================================== */

const nose =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .08,
            12,
            12
        ),

        skinMaterial

    );


nose.position.set(
    0,
    2.9,
    -.68
);


player.add(
    nose
);


/* =====================================================
   입
===================================================== */

const mouth =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .42,
            .09,
            .035
        ),

        blackMaterial

    );


mouth.position.set(
    0,
    2.68,
    -.65
);


mouth.rotation.z =
    -.02;


player.add(
    mouth
);


/* =====================================================
   귀
===================================================== */

function createEar(
    x
) {

    const ear =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .13,
                16,
                12
            ),

            skinMaterial

        );


    ear.position.set(
        x,
        2.9,
        -.02
    );


    player.add(
        ear
    );


    /* 귀걸이 */

    const earring =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .065,
                12,
                12
            ),

            yellowGoldMaterial

        );


    earring.position.set(
        x,
        2.72,
        -.05
    );


    player.add(
        earring
    );

}


createEar(
    -.68
);


createEar(
    .68
);


/* =====================================================
   팔
===================================================== */

function createArm(
    side
) {

    const armGroup =
        new THREE.Group();


    armGroup.position.set(
        side * .82,
        1.9,
        0
    );


    player.add(
        armGroup
    );


    const upperArm =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .19,
                .82,
                8,
                12
            ),

            yellowMaterial

        );


    upperArm.rotation.z =
        side * -.95;


    upperArm.castShadow =
        true;


    armGroup.add(
        upperArm
    );


    /* 팔꿈치 */

    const elbow =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .21,
                14,
                12
            ),

            yellowMaterial

        );


    elbow.position.set(
        side * .38,
        -.34,
        0
    );


    armGroup.add(
        elbow
    );


    /* 장갑 */

    const glove =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .22,
                .38,
                8,
                12
            ),

            greenMaterial

        );


    glove.position.set(
        side * .63,
        -.62,
        0
    );


    glove.rotation.z =
        side * -.25;


    glove.castShadow =
        true;


    armGroup.add(
        glove
    );


    /* 손바닥 */

    const palm =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .22,
                16,
                12
            ),

            skinMaterial

        );


    palm.position.set(
        side * .72,
        -.77,
        0
    );


    palm.scale.set(
        1,
        .8,
        .65
    );


    armGroup.add(
        palm
    );

}


createArm(
    -1
);


createArm(
    1
);


/* =====================================================
   허리띠
===================================================== */

const belt =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.38,
            .25,
            .82
        ),

        pinkMaterial

    );


belt.position.set(
    0,
    1.05,
    -.02
);


belt.castShadow =
    true;


player.add(
    belt
);


/* =====================================================
   허리 앞쪽 긴 천
===================================================== */

const beltCloth =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .38,
            .95,
            .09
        ),

        pinkMaterial

    );


beltCloth.position.set(
    .25,
    .62,
    -.45
);


beltCloth.rotation.z =
    -.08;


player.add(
    beltCloth
);


/* =====================================================
   바지
===================================================== */

function createPantsLeg(
    x
) {

    const leg =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .43,
                1.25,
                8,
                16
            ),

            whiteMaterial

        );


    leg.position.set(
        x,
        .48,
        0
    );


    leg.scale.z =
        .85;


    leg.castShadow =
        true;


    player.add(
        leg
    );


    /* 바지 끝 */

    const cuff =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                .40,
                .065,
                10,
                20
            ),

            whiteMaterial

        );


    cuff.rotation.x =
        Math.PI / 2;


    cuff.position.set(
        x,
        -.08,
        0

/* =====================================================
   마우스 → 월드 방향
===================================================== */

function getAimDirection() {

    const raycaster =
        new THREE.Raycaster();


    raycaster.setFromCamera(
        mouse,
        camera
    );


    /*
        y = 0인 경기장과
        마우스 광선을 교차시킨다.
    */

    const groundPlane =
        new THREE.Plane(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            0

        );


    const hitPoint =
        new THREE.Vector3();


    raycaster.ray.intersectPlane(
        groundPlane,
        hitPoint
    );


    const direction =
        hitPoint
            .clone()
            .sub(
                player.position
            );


    direction.y =
        0;


    if (
        direction.lengthSq()
        < .001
    ) {

        direction.set(
            0,
            0,
            -1
        );

    }


    return direction.normalize();

}


/* =====================================================
   방향으로 대시
===================================================== */

function performDash(
    direction
) {

    const start =
        player.position.clone();


    /*
        긴 대시
    */

    const distance =
        DASH_DISTANCE;


    /*
        대시 도중 장애물 체크는
        간단하게 여러 지점을 검사한다.
    */

    const steps =
        12;


    const stepDistance =
        distance / steps;


    for (
        let i = 0;
        i < steps;
        i++
    ) {

        const next =
            player.position
                .clone()
                .add(
                    direction
                        .clone()
                        .multiplyScalar(
                            stepDistance
                        )
                );


        if (
            isPositionBlocked(
                next,
                .65
            )
        ) {

            break;

        }


        player.position.copy(
            next
        );

    }


    player.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


    createDashTrail(
        start,
        player.position
    );

}


/* =====================================================
   위치 충돌
===================================================== */

function isPositionBlocked(
    position,
    radius
) {

    if (
        position.x <
        -32 ||
        position.x >
        32 ||
        position.z <
        -32 ||
        position.z >
        32
    ) {

        return true;

    }


    for (
        const obstacle
        of obstacles
    ) {

        const box =
            new THREE.Box3()
                .setFromObject(
                    obstacle
                );


        box.expandByScalar(
            radius
        );


        if (
            box.containsPoint(
                new THREE.Vector3(
                    position.x,
                    1,
                    position.z
                )
            )
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   대시 잔상
===================================================== */

function createDashTrail(
    start,
    end
) {

    const geometry =
        new THREE.CylinderGeometry(

            .18,
            .18,

            start.distanceTo(
                end
            ),

            8

        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xbda8ff,

            transparent:
                true,

            opacity:
                .35

        });


    const trail =
        new THREE.Mesh(
            geometry,
            material
        );


    trail.position.copy(
        start
    );


    trail.position.add(
        end
    ).multiplyScalar(
        .5
    );


    trail.lookAt(
        end
    );


    scene.add(
        trail
    );


    setTimeout(
        () => {

            scene.remove(
                trail
            );

            geometry.dispose();

            material.dispose();

        },
        160
    );

}

const projectiles = [];


function createProjectile(options) {

    const {

        position,

        direction,

        speed,

        damage,

        owner,

        type,

        color

    } = options;


    let mesh;


    /* =================================================
       신발
    ================================================= */

    if (
        type === "shoe"
    ) {

        const group =
            new THREE.Group();


        const shoe =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .55,
                    .18,
                    1.0
                ),

                    color:
                        0x7435dc,

                    emissive:
                        0x1c073b,

                    emissiveIntensity:
                        .4

                })

            );


        group.add(
            shoe
        );


        mesh =
            group;

    }


    /* =================================================
       탬버린
    ================================================= */

    else if (
        type === "tambourine"
    ) {

        const group =
            new THREE.Group();


        /*
            원형 프레임
        */

        const ring =
            new THREE.Mesh(

                new THREE.TorusGeometry(
                    .48,
                    .10,
                    10,
                    24
                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0xffca36,

                    metalness:
                        .5,

                    roughness:
                        .3

                })

            );


        group.add(
            ring
        );


        /*
            가운데
        */

        const center =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .34,
                    .34,
                    .08,
                    24
                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0xff4cb2,

                    roughness:
                        .4

                })

            );


        center.rotation.x =
            Math.PI / 2;


        group.add(
            center
        );


        /*
            탬버린의 작은 금속판
        */

        for (
            let i = 0;
            i < 8;
            i++
        ) {

            const a =
                i *
                Math.PI *
                2 / 8;


            const cymbal =
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .07,
                        .07,
                        .04,
                        8
                    ),

                    yellowGoldMaterial

                );


            cymbal.position.set(

                Math.cos(a) * .55,

                0,

                Math.sin(a) * .55

            );


            cymbal.rotation.z =
                Math.PI / 2;


            group.add(
                cymbal
            );

        }


        mesh =
            group;

    }


    /* =================================================
       칼날
    ================================================= */

    else if (
        type === "blade"
    ) {

        const group =
            new THREE.Group();


        const blade =
            new THREE.Mesh(

                new THREE.CapsuleGeometry(
                    .09,
                    .75,
                    6,
                    10
                ),

                new THREE.MeshStandardMaterial({

                    color:
                        0x72eaff,

                    emissive:
                        0x168fb2,

                    emissiveIntensity:
                        1.5,

                    metalness:
                        .3

                })

            );


        blade.rotation.z =
            Math.PI / 2;


        group.add(
            blade
        );


        mesh =
            group;

    }


    /* =================================================
       적 총알
    ================================================= */

    else {

        mesh =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    .27,
                    16,
                    16
                ),

                new THREE.MeshStandardMaterial({

                    color:
                        color,

                    emissive:
                        color,

                    emissiveIntensity:
                        2

                })

            );

    }


    mesh.position.copy(
        position
    );


    scene.add(
        mesh
    );


    projectiles.push({

        mesh,

        previousPosition:
            position.clone(),

        direction:
            direction.clone(),

        speed,

        damage,

        owner,

        type,

        life:
            2.5,

        hit:
            false

    });

}

function createFanEffect(

    position,

    direction,

    angleDegrees,

    radius

) {

    const angle =
        THREE.MathUtils.degToRad(
            angleDegrees
        );


    const geometry =
        new THREE.CircleGeometry(

            radius,

            40,

            -angle / 2,

            angle

        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0x55ddff,

            transparent:
                true,

            opacity:
                .23,

            side:
                THREE.DoubleSide

        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    mesh.position.copy(
        position
    );


    mesh.position.y =
        .05;


    mesh.rotation.x =
        -Math.PI / 2;


    const rotation =
        Math.atan2(
            direction.x,
            direction.z
        );


    mesh.rotation.z =
        -rotation -
        Math.PI / 2;


    scene.add(
        mesh
    );


    setTimeout(
        () => {

            scene.remove(
                mesh
            );

            geometry.dispose();

            material.dispose();

        },
        250
    );

}

/* =====================================================
   데미지 숫자
===================================================== */

function createDamageNumber(

    position,

    damage

) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        256;


    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.font =
        "bold 52px Arial";


    ctx.textAlign =
        "center";


    ctx.lineWidth =
        8;


    ctx.strokeStyle =
        "#000";


    ctx.fillStyle =
        "#fff";


    ctx.strokeText(
        "-" + damage,
        128,
        72
    );


    ctx.fillText(
        "-" + damage,
        128,
        72
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const material =
        new THREE.SpriteMaterial({

            map:
                texture,

            transparent:
                true

        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.position.copy(
        position
    );


    sprite.scale.set(
        2.2,
        1.1,
        1
    );


    scene.add(
        sprite
    );


    let elapsed =
        0;


    function animateDamage() {

        elapsed +=
            .016;


        sprite.position.y +=
            .025;


        material.opacity =
            Math.max(
                0,
                1 -
                elapsed
            );


        if (
            elapsed < 1
        ) {

            requestAnimationFrame(
                animateDamage
            );

        }

        else {

            scene.remove(
                sprite
            );

            texture.dispose();

            material.dispose();

        }

    }


    animateDamage();

}


/* =====================================================
   히트 이펙트
===================================================== */

function createHitEffect(
    position
) {

    const geometry =
        new THREE.SphereGeometry(
            .4,
            12,
            12
        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xffffff,

            transparent:
                true,

            opacity:
                .8

        });


    const effect =
        new THREE.Mesh(
            geometry,
            material
        );


    effect.position.copy(
        position
    );


    effect.position.y +=
        1.4;


    scene.add(
        effect
    );


    let timer =
        0;


    function animateHit() {

        timer +=
            .016;


        effect.scale.setScalar(
            1 +
            timer * 4
        );


        material.opacity =
            .8 -
            timer;


        if (
            timer < .8
        ) {

            requestAnimationFrame(
                animateHit
            );

        }

        else {

            scene.remove(
                effect
            );

            geometry.dispose();

            material.dispose();

        }

    }


    animateHit();

}

function createMuzzleEffect(

) {

    const geometry =

    const material =
        new THREE.MeshBasicMaterial({

            color:
                0xffe36b,

            transparent:
                true,

            opacity:
                .8

        });


    const flash =
        new THREE.Mesh(
            geometry,
            material
        );


    flash.position.copy(
        position
    );


    flash.position.y +=
        1.3;


    scene.add(
        flash
    );


    setTimeout(
        () => {

            scene.remove(
                flash
            );

            geometry.dispose();

            material.dispose();

        },
        100
    );

}


/* =====================================================
   적 AI
===================================================== */

function updateEnemy(
    delta
) {

    if (
        !enemyData.alive
    )
        return;


    const toPlayer =
        player.position
            .clone()
            .sub(
                enemy.position
            );


    toPlayer.y =
        0;


    const distance =
        toPlayer.length();


    if (
        distance >
        .001
    ) {

        toPlayer.normalize();

    }


    /*
        적 추적
    */

    if (
        distance > 8
    ) {

        const move =
            toPlayer.clone()
                .multiplyScalar(
                    enemyData.speed *
                    delta
                );


        const next =
            enemy.position
                .clone()
                .add(move);


        if (
            !isPositionBlocked(
                next,
                .65
            )
        ) {

            enemy.position.copy(
                next
            );

        }

    }


    /*
        플레이어 바라보기
    */

    enemy.rotation.y =
        Math.atan2(
            toPlayer.x,
            toPlayer.z
        );


    /*
        공격
    */

    enemyData.shootTimer -=
        delta;


    if (
        enemyData.shootTimer <= 0 &&
        distance < 30
    ) {

        enemyShoot(
            toPlayer
        );


        enemyData.shootTimer =
            1.5;

    }

}


/* =====================================================
   적 공격
===================================================== */

function enemyShoot(
    direction
) {

    /*
        owner가 enemy다.

        따라서 아래 충돌 시스템에서
        플레이어만 대상으로 한다.
    */

    createProjectile({

        position:
            enemy.position
                .clone()
                .add(
                    new THREE.Vector3(
                        0,
                        1.45,
                        0
                    )
                ),

        direction,

        speed:
            14,

        damage:
            DAMAGE.ENEMY_BULLET,

        owner:
            "enemy",

        type:
            "enemyBullet",

        color:
            0xff4242

    });

}


/* =====================================================
   선분과 구 충돌
===================================================== */

/*
    빠른 신발/탬버린/칼날이
    프레임 사이에서 적을 통과하는 문제를
    방지한다.

    이전 위치 → 현재 위치의 선분을 검사한다.
*/

function segmentHitsSphere(

    start,

    end,

    center,

    radius

) {

    const segment =
        end.clone()
            .sub(start);


    const lengthSq =
        segment.lengthSq();


    if (
        lengthSq === 0
    ) {

        return (
            start.distanceTo(
                center
            ) <= radius
        );

    }


    const t =
        THREE.MathUtils.clamp(

            center
                .clone()
                .sub(start)
                .dot(segment)
                /
                lengthSq,

            0,
            1

        );


    const closest =
        start.clone()
            .add(
                segment
                    .multiplyScalar(t)
            );


    return (
        closest.distanceTo(
            center
        ) <= radius
    );

}


/* =====================================================
   투사체 업데이트
===================================================== */

function updateProjectiles(
    delta
) {

    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {

        const projectile =
            projectiles[i];


        if (
            projectile.hit
        )
            continue;


        /*
            이전 위치 저장
        */

        projectile.previousPosition =
            projectile.mesh.position
                .clone();


        /*
            이동
        */

        projectile.mesh.position.add(

            projectile.direction
                .clone()
                .multiplyScalar(
                    projectile.speed *
                    delta
                )

        );


        /*
            탬버린 회전
        */

        if (
            projectile.type ===
            "tambourine"
        ) {

            projectile.mesh
                .rotation.y +=
                12 * delta;

        }


        /*
            칼날 회전
        */

        if (
            projectile.type ===
            "blade"
        ) {

            projectile.mesh
                .rotation.z +=
                8 * delta;

        }


        projectile.life -=
            delta;


        /* =================================================
           PLAYER 투사체
        ================================================= */

        if (
            projectile.owner ===
            "player"
        ) {

            /*
                플레이어 투사체는
                오직 적만 공격한다.
            */

            if (
                enemyData.alive
            ) {

                const hit =
                    segmentHitsSphere(

                        projectile
                            .previousPosition,

                        projectile
                            .mesh
                            .position,

                        enemy.position
                            .clone()
                            .add(
                                new THREE.Vector3(
                                    0,
                                    1.2,
                                    0
                                )
                            ),

                        1.25

                    );


                if (
                    hit
                ) {

                    damageEnemy(
                        projectile.damage
                    );


                    removeProjectile(
                        i
                    );


                    continue;

                }

            }

        }


        /* =================================================
           ENEMY 투사체
        ================================================= */

        else if (
            projectile.owner ===
            "enemy"
        ) {

            /*
                매우 중요.

                적 투사체는
                절대로 enemy를 검사하지 않는다.

                오직 player만 검사한다.
            */

            if (
                playerData.alive
            ) {

                const hit =
                    segmentHitsSphere(

                        projectile
                            .previousPosition,

                        projectile
                            .mesh
                            .position,

                        player.position
                            .clone()
                            .add(
                                new THREE.Vector3(
                                    0,
                                    1.1,
                                    0
                                )
                            ),

                        1.15

                    );


                if (
                    hit
                ) {

                    damagePlayer(
                        projectile.damage
                    );


                    removeProjectile(
                        i
                    );


                    continue;

                }

            }

        }


        /*
            수명
        */

        if (
            projectile.life <= 0
        ) {

            removeProjectile(
                i
            );

            continue;

        }


        /*
            경기장 밖
        */

        if (
            Math.abs(
                projectile.mesh
                    .position.x
            ) > 40 ||

            Math.abs(
                projectile.mesh
                    .position.z
            ) > 40
        ) {

            removeProjectile(
                i
            );

        }

    }

}


/* =====================================================
   투사체 삭제
===================================================== */

function removeProjectile(
    index
) {

    const projectile =
        projectiles[index];


    if (
        !projectile
    )
        return;


    scene.remove(
        projectile.mesh
    );


    projectile.mesh
        .traverse(
            child => {

                if (
                    child.geometry
                ) {

                    child.geometry
                        .dispose();

                }


                if (
                    child.material
                ) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material
                            .forEach(
                                material =>
                                    material.dispose()
                            );

                    }

                    else {

                        child.material
                            .dispose();

                    }

                }

            }
        );


    projectiles.splice(
        index,
        1
    );

}


/* =====================================================
   플레이어 이동
===================================================== */

function updatePlayer(
    delta
) {

    if (
        !playerData.alive
    )
        return;


    const move =
        new THREE.Vector3();


    if (
        keys["w"]
    )
        move.z -= 1;


    if (
        keys["s"]
    )
        move.z += 1;


    if (
        keys["a"]
    )
        move.x -= 1;


    if (
        keys["d"]
    )
        move.x += 1;


    if (
        move.lengthSq()
        > 0
    ) {

        move.normalize();


        const next =
            player.position
                .clone()
                .add(

                    move
                        .clone()
                        .multiplyScalar(
                            playerData.speed *
                            delta
                        )

                );


        if (
            !isPositionBlocked(
                next,
                .6
            )
        ) {

            player.position.copy(
                next
            );

        }


        /*
            이동 방향으로 바라보기
        */

        player.rotation.y =
            Math.atan2(
                move.x,
                move.z
            );

    }


    /*
        공격 쿨다운
    */

    if (
        playerData.dashCooldown
        > 0
    ) {

        playerData.dashCooldown -=
            delta;

    }


    /*
        경기장 제한
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -32,
            32
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -32,
            32
        );

}


/* =====================================================
   연계 타이머
===================================================== */

function updateCombo(
    delta
) {

    if (
        playerData.combo > 0
    ) {

        playerData.comboTimer -=
            delta;


        if (
            playerData.comboTimer <=
            0
        ) {

            playerData.combo =
                0;

            playerData.comboTimer =
                0;

            updateAttackUI();

        }

    }

}


/* =====================================================
   공격 UI
===================================================== */

function updateAttackUI() {

    const attackName =
        document.getElementById(
            "attackName"
        );


    const nextAttack =
        document.getElementById(
            "nextAttack"
        );


    if (
        playerData.combo === 0
    ) {

        attackName.textContent =
            "👟 신발";

        nextAttack.textContent =
            "🪘 탬버린";

    }

    else if (
        playerData.combo === 1
    ) {

        attackName.textContent =
            "🪘 탬버린";

        nextAttack.textContent =
            "🔷 칼날 ×3";

    }

    else {

        attackName.textContent =
            "🔷 칼날 ×3";

        nextAttack.textContent =
            "👟 신발";

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    const playerPercent =
        playerData.hp /
        playerData.maxHp *
        100;


    const enemyPercent =
        enemyData.hp /
        enemyData.maxHp *
        100;


    document.getElementById(
        "playerHPBar"
    ).style.width =
        playerPercent + "%";


    document.getElementById(
        "enemyHPBar"
    ).style.width =
        enemyPercent + "%";


    document.getElementById(
        "playerHPText"
    ).textContent =

        Math.round(
            playerData.hp
        )
        +
        " / "
        +
        playerData.maxHp;


    document.getElementById(
        "enemyHPText"
    ).textContent =

        Math.round(
            enemyData.hp
        )
        +
        " / "
        +
        enemyData.maxHp;

}


/* =====================================================
   카메라
===================================================== */

function updateCamera() {

    const desired =
        player.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    16,
                    15
                )
            );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        player.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    0,
                    0
                )
            )
    );

}


/* =====================================================
   공격 UI 타이머
===================================================== */

function updateComboUI() {

    const element =
        document.getElementById(
            "comboTimer"
        );


    if (
        playerData.combo > 0
    ) {

        element.textContent =
            playerData.comboTimer
                .toFixed(1)
            +
            "초";

    }

    else {

        element.textContent =
            "준비";

    }

}


/* =====================================================
   애니메이션
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(
        delta
    );


    updateEnemy(
        delta
    );


    updateProjectiles(
        delta
    );


    updateCombo(
        delta
    );


    updateComboUI();


    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   리사이즈
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   시작
===================================================== */

updateUI();

updateAttackUI();


</script>
