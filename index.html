<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mina Style 3D Arena</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    position: fixed;
    inset: 0;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

/* =========================
   상단 UI
========================= */

#top {
    position: absolute;
    top: 18px;
    left: 18px;
    right: 18px;

    display: flex;
    justify-content: space-between;

    color: white;
    font-weight: bold;
}

.panel {
    min-width: 230px;

    background: rgba(0,0,0,.48);

    padding: 12px 16px;

    border-radius: 14px;

    backdrop-filter: blur(5px);

    text-shadow:
        0 2px 4px black;
}

.barOuter {
    width: 230px;
    height: 20px;

    background: #222;

    border: 2px solid white;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 5px;
}

.bar {
    width: 100%;
    height: 100%;

    transition: width .15s;
}

#playerBar {
    background: #37e65b;
}

#enemyBar {
    background: #ff3c3c;
}

/* =========================
   조작 설명
========================= */

#instructions {
    position: absolute;

    left: 18px;
    bottom: 18px;

    color: white;

    background: rgba(0,0,0,.48);

    padding: 12px 16px;

    border-radius: 12px;

    line-height: 1.5;
}

/* =========================
   공격 UI
========================= */

#attackInfo {

    position: absolute;

    right: 18px;
    bottom: 18px;

    color: white;

    background: rgba(0,0,0,.48);

    padding: 12px 18px;

    border-radius: 12px;

    text-align: right;

}

/* =========================
   조준점
========================= */

#crosshair {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 32px;
    height: 32px;

    transform: translate(-50%, -50%);

    border:
        2px solid
        rgba(255,255,255,.8);

    border-radius: 50%;
}

#crosshair::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    left: 11px;
    top: 11px;

    background: white;

    border-radius: 50%;
}

/* =========================
   승패 화면
========================= */

#message {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.6);

    color: white;

    font-size: 64px;

    font-weight: bold;

    text-shadow:
        0 5px 15px black;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

    <div id="top">

        <div class="panel">

            미나 HP

            <div class="barOuter">
                <div
                    id="playerBar"
                    class="bar">
                </div>
            </div>

            <span id="playerHP">
                10000 / 10000
            </span>

        </div>


        <div class="panel">

            적 AI HP

            <div class="barOuter">

                <div
                    id="enemyBar"
                    class="bar">
                </div>

            </div>

            <span id="enemyHP">
                10000 / 10000
            </span>

        </div>

    </div>


    <div id="crosshair"></div>


    <div id="instructions">

        <b>조작</b><br>

        WASD : 이동<br>

        마우스 : 공격 방향<br>

        클릭 : 공격 + 대시

    </div>


    <div id="attackInfo">

        공격:
        <b id="attackName">
            신발
        </b>

        <br>

        다음 공격:
        <span id="nextAttack">
            탬버린
        </span>

        <br>

        연계 시간:
        <span id="comboTime">
            준비
        </span>

    </div>


    <div id="message">

        <div id="messageText">
            승리!
        </div>

    </div>

</div>


<!-- Three.js -->

<script type="importmap">

{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
}

</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   게임 기본 설정
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x142033
    );

scene.fog =
    new THREE.Fog(
        0x142033,
        30,
        100
    );


/* 카메라 */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        .1,
        200
    );


camera.position.set(
    0,
    15,
    15
);


/* 렌더러 */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled =
    true;


document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   조명
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x303040,
        2.2
    );

scene.add(hemi);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

light.position.set(
    10,
    20,
    10
);

light.castShadow =
    true;

scene.add(light);


/* =========================================================
   경기장
========================================================= */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            70,
            70
        ),

        new THREE.MeshStandardMaterial({
            color: 0x34495e,
            roughness: .85
        })

    );


floor.rotation.x =
    -Math.PI / 2;

floor.receiveShadow =
    true;

scene.add(floor);


/* 경기장 격자 */

const grid =
    new THREE.GridHelper(
        70,
        35,
        0x71869a,
        0x405265
    );

grid.position.y =
    .02;

scene.add(grid);


/* =========================================================
   장애물
========================================================= */

const obstacles = [];


function createObstacle(
    x,
    z,
    sx,
    sz
) {

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                sx,
                2,
                sz
            ),

            new THREE.MeshStandardMaterial({
                color: 0x68798a
            })

        );

    mesh.position.set(
        x,
        1,
        z
    );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    scene.add(mesh);

    obstacles.push(mesh);

}


/* 몇 개의 장애물 */

createObstacle(
    -10,
    -2,
    5,
    2
);

createObstacle(
    10,
    1,
    5,
    2
);

createObstacle(
    0,
    -8,
    4,
    3
);

createObstacle(
    -5,
    9,
    3,
    3
);


/* =========================================================
   플레이어
========================================================= */

const player =
    new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    12
);


/* =========================================================
   미나 스타일 외형
========================================================= */

/*
    참고 이미지의 특징을 바탕으로 한
    오리지널 3D 스타일

    보라색 모자
    보라색 머리
    노란색 상의
    흰색 바지
    분홍색 허리띠
    초록색 장갑
*/


/* 몸 */

const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .65,
            1.15,
            6,
            16
        ),

        new THREE.MeshStandardMaterial({
            color: 0xf2bd28
        })

    );

body.position.y =
    1.45;

body.castShadow =
    true;

player.add(body);


/* =========================================================
   바지
========================================================= */

const pantsLeft =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .42,
            .5,
            1.25,
            12
        ),

        new THREE.MeshStandardMaterial({
            color: 0xf1eee4
        })

    );

pantsLeft.position.set(
    -.32,
    .55,
    0
);

pantsLeft.castShadow =
    true;

player.add(pantsLeft);


const pantsRight =
    pantsLeft.clone();

pantsRight.position.x =
    .32;

player.add(pantsRight);


/* =========================================================
   분홍색 허리띠
========================================================= */

const belt =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.35,
            .25,
            .8
        ),

        new THREE.MeshStandardMaterial({
            color: 0xe83d9c
        })

    );

belt.position.y =
    1.02;

belt.castShadow =
    true;

player.add(belt);


/* =========================================================
   머리
========================================================= */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .57,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({
            color: 0xc77c5b
        })

    );

head.position.y =
    2.75;

head.castShadow =
    true;

player.add(head);


/* =========================================================
   보라색 머리카락
========================================================= */

const hair =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .62,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({
            color: 0x7137c9
        })

    );

hair.position.set(
    0,
    2.92,
    -.05
);

hair.scale.set(
    1,
    .85,
    .85
);

hair.castShadow =
    true;

player.add(hair);


/* =========================================================
   보라색 모자
========================================================= */

const hat =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .72,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({
            color: 0x742be0
        })

    );

hat.position.set(
    0,
    3.32,
    0
);

hat.scale.set(
    1,
    .55,
    1
);

hat.castShadow =
    true;

player.add(hat);


/* 모자 앞 장식 */

const hatSymbol =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .35,
            .12,
            .06
        ),

        new THREE.MeshStandardMaterial({
            color: 0xffd629
        })

    );

hatSymbol.position.set(
    0,
    3.38,
    -.7
);

player.add(hatSymbol);


/* =========================================================
   눈
========================================================= */

function createEye(x) {

    const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .13,
                16,
                16
            ),

            new THREE.MeshStandardMaterial({
                color: 0xffffff
            })

        );

    eye.position.set(
        x,
        2.82,
        -.52
    );

    player.add(eye);

    return eye;

}

createEye(-.2);
createEye(.2);


/* =========================================================
   팔
========================================================= */

function createArm(x) {

    const arm =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .18,
                .85,
                6,
                10
            ),

            new THREE.MeshStandardMaterial({
                color: 0xf2bd28
            })

        );

    arm.position.set(
        x,
        1.65,
        0
    );

    arm.rotation.z =
        x > 0
        ? -.9
        : .9;

    arm.castShadow =
        true;

    player.add(arm);


    /* 초록 장갑 */

    const glove =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .25,
                14,
                14
            ),

            new THREE.MeshStandardMaterial({
                color: 0x19c59c
            })

        );

    glove.position.set(
        x > 0
        ? x + .48
        : x - .48,

        1.25,

        0
    );

    glove.castShadow =
        true;

    player.add(glove);

}

createArm(-.9);
createArm(.9);


/* =========================================================
   신발
========================================================= */

function createShoe(x) {

    const s =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .65,
                .25,
                .95
            ),

            new THREE.MeshStandardMaterial({
                color: 0x7137db
            })

        );

    s.position.set(
        x,
        .1,
        -.05
    );

    s.castShadow =
        true;

    player.add(s);

}

createShoe(-.35);
createShoe(.35);


/* =========================================================
   적 AI
========================================================= */

const enemy =
    new THREE.Group();

scene.add(enemy);

enemy.position.set(
    0,
    0,
    -12
);


/* 적 몸 */

const enemyBody =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .7,
            1.2,
            6,
            16
        ),

        new THREE.MeshStandardMaterial({
            color: 0x5266dd
        })

    );

enemyBody.position.y =
    1.4;

enemyBody.castShadow =
    true;

enemy.add(enemyBody);


/* 적 머리 */

const enemyHead =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .55,
            20,
            20
        ),

        new THREE.MeshStandardMaterial({
            color: 0xb98269
        })

    );

enemyHead.position.y =
    2.65;

enemyHead.castShadow =
    true;

enemy.add(enemyHead);


/* 적 무기 */

const enemyGun =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .14,
            .14,
            .9,
            12
        ),

        new THREE.MeshStandardMaterial({
            color: 0x222222
        })

    );

enemyGun.rotation.z =
    Math.PI / 2;

enemyGun.position.set(
    .75,
    1.5,
    0
);

enemy.add(enemyGun);


/* =========================================================
   게임 데이터
========================================================= */

const playerData = {

    hp: 10000,

    maxHp: 10000,

    speed: 8,

    alive: true,

    combo: 0,

    comboTimer: 0

};


const enemyData = {

    hp: 10000,

    maxHp: 10000,

    alive: true,

    speed: 2.4,

    shootTimer: 1

};


/* =========================================================
   공격 피해량
========================================================= */

/*
   이전보다 훨씬 낮춤
*/

const DAMAGE = {

    SHOE: 800,

    TAMBOURINE: 1000,

    BLADE: 700,

    ENEMY: 3000

};


/* =========================================================
   대시 설정
========================================================= */

/*
   모든 공격이 이 대시를 사용한다.

   길게 설정
*/

const DASH_DISTANCE = 6;


/* =========================================================
   키 입력
========================================================= */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

    }
);

window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   마우스
========================================================= */

const mouse =
    new THREE.Vector2();


window.addEventListener(
    "mousemove",
    e => {

        mouse.x =
            e.clientX /
            window.innerWidth *
            2 - 1;

        mouse.y =
            -(e.clientY /
            window.innerHeight *
            2 - 1);

    }
);


/* =========================================================
   공격 방향
========================================================= */

function getAttackDirection() {

    /*
        마우스 방향을 월드 방향으로
        변환하는 간단한 방식
    */

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        mouse,
        camera
    );


    const plane =
        new THREE.Plane(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            0
        );


    const point =
        new THREE.Vector3();


    raycaster.ray.intersectPlane(
        plane,
        point
    );


    const direction =
        point
            .sub(player.position);


    direction.y = 0;


    if (
        direction.lengthSq()
        < .001
    ) {

        direction.set(
            0,
            0,
            -1
        );

    }


    return direction.normalize();

}


/* =========================================================
   대시
========================================================= */

function dash(
    direction
) {

    /*
        모든 공격에서 호출된다.
    */

    const start =
        player.position.clone();


    player.position.add(
        direction.clone()
            .multiplyScalar(
                DASH_DISTANCE
            )
    );


    /*
        경기장 밖 방지
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -31,
            31
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -31,
            31
        );


    /*
        방향 표시
    */

    player.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


    /*
        대시 이펙트
    */

    createDashEffect(
        start,
        player.position
    );

}


/* =========================================================
   대시 이펙트
========================================================= */

function createDashEffect(
    start,
    end
) {

    const distance =
        start.distanceTo(end);


    const mesh =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .18,
                distance,
                6,
                10
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: .35
            })

        );


    mesh.position
        .copy(start)
        .add(end)
        .multiplyScalar(.5);


    mesh.lookAt(end);


    scene.add(mesh);


    setTimeout(
        () => {

            scene.remove(mesh);

        },
        150
    );

}


/* =========================================================
   투사체 배열
========================================================= */

const projectiles = [];


/* =========================================================
   투사체
========================================================= */

function createProjectile({

    position,

    direction,

    color,

    damage,

    speed,

    owner,

    size = .25

}) {

    const mesh =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                size,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({

                color,

                emissive: color,

                emissiveIntensity: 2

            })

        );


    mesh.position.copy(
        position
    );


    scene.add(mesh);


    projectiles.push({

        mesh,

        direction:
            direction.clone(),

        speed,

        damage,

        owner,

        life: 2

    });

}


/* =========================================================
   신발 공격
========================================================= */

function shoeAttack() {

    const direction =
        getAttackDirection();


    /*
        공격하면 무조건 긴 대시
    */

    dash(direction);


    /*
        신발 투사체
    */

    createProjectile({

        position:
            player.position
                .clone()
                .add(
                    new THREE.Vector3(
                        0,
                        1.5,
                        0
                    )
                ),

        direction,

        color: 0xffd62e,

        damage:
            DAMAGE.SHOE,

        speed: 28,

        owner: "player",

        size: .35

    });

}


/* =========================================================
   부채꼴
========================================================= */

function createFan(

    position,

    direction,

    angleDeg,

    radius,

    color

) {

    const angle =
        THREE.MathUtils.degToRad(
            angleDeg
        );


    const geometry =
        new THREE.CircleGeometry(
            radius,
            32,
            -angle / 2,
            angle
        );


    const material =
        new THREE.MeshBasicMaterial({

            color,

            transparent: true,

            opacity: .4,

            side:
                THREE.DoubleSide

        });


    const fan =
        new THREE.Mesh(
            geometry,
            material
        );


    fan.position.copy(
        position
    );


    fan.position.y =
        .05;


    const rotation =
        Math.atan2(
            direction.x,
            direction.z
        );


    fan.rotation.x =
        -Math.PI / 2;


    fan.rotation.z =
        -rotation -
        Math.PI / 2;


    scene.add(fan);


    setTimeout(
        () => {

            scene.remove(fan);

            geometry.dispose();
            material.dispose();

        },
        250
    );

}


/* =========================================================
   부채꼴 공격 판정
========================================================= */

function coneDamage(

    origin,

    direction,

    radius,

    angleDeg,

    damage

) {

    if (
        !enemyData.alive
    )
        return;


    const toEnemy =
        enemy.position
            .clone()
            .sub(origin);


    toEnemy.y = 0;


    const distance =
        toEnemy.length();


    if (
        distance > radius
    )
        return;


    toEnemy.normalize();


    const dot =
        direction.dot(
            toEnemy
        );


    const angle =
        Math.acos(
            THREE.MathUtils.clamp(
                dot,
                -1,
                1
            )
        );


    if (
        angle <=
        THREE.MathUtils.degToRad(
            angleDeg / 2
        )
    ) {

        damageEnemy(
            damage
        );

    }

}


/* =========================================================
   탬버린 공격
========================================================= */

function tambourineAttack() {

    const direction =
        getAttackDirection();


    /*
        탬버린도 대시
    */

    dash(direction);


    createFan(

        player.position,

        direction,

        50,

        5,

        0xff55dd

    );


    coneDamage(

        player.position,

        direction,

        5,

        50,

        DAMAGE.TAMBOURINE

    );

}


/* =========================================================
   칼날 3개
========================================================= */

function bladeAttack() {

    const direction =
        getAttackDirection();


    /*
        칼날도 대시
    */

    dash(direction);


    createFan(

        player.position,

        direction,

        90,

        7,

        0x55ddff

    );


    /*
        3개의 칼날
    */

    const bladeAngles = [

        -30,

        0,

        30

    ];


    for (
        const angle of bladeAngles
    ) {

        const d =
            direction.clone();


        d.applyAxisAngle(

            new THREE.Vector3(
                0,
                1,
                0
            ),

            THREE.MathUtils.degToRad(
                angle
            )

        );


        createProjectile({

            position:
                player.position
                    .clone()
                    .add(
                        new THREE.Vector3(
                            0,
                            1.4,
                            0
                        )
                    ),

            direction: d,

            color: 0x5de1ff,

            damage:
                DAMAGE.BLADE,

            speed: 24,

            owner: "player",

            size: .22

        });

    }

}


/* =========================================================
   공격 연계
========================================================= */

function playerAttack() {

    if (
        !playerData.alive
    )
        return;


    /* 1타 */

    if (
        playerData.combo === 0
    ) {

        shoeAttack();

        playerData.combo =
            1;

        playerData.comboTimer =
            1.5;

        updateAttackUI();

        return;

    }


    /* 2타 */

    if (
        playerData.combo === 1
    ) {

        tambourineAttack();

        playerData.combo =
            2;

        playerData.comboTimer =
            1.5;

        updateAttackUI();

        return;

    }


    /* 3타 */

    if (
        playerData.combo === 2
    ) {

        bladeAttack();

        playerData.combo =
            0;

        playerData.comboTimer =
            0;

        updateAttackUI();

    }

}


/* =========================================================
   마우스 클릭
========================================================= */

window.addEventListener(
    "mousedown",
    e => {

        if (
            e.button === 0
        ) {

            playerAttack();

        }

    }
);


/* =========================================================
   적 피해
========================================================= */

function damageEnemy(
    damage
) {

    if (
        !enemyData.alive
    )
        return;


    enemyData.hp -=
        damage;


    enemyData.hp =
        Math.max(
            0,
            enemyData.hp
        );


    showDamageNumber(
        enemy.position.clone()
            .add(
                new THREE.Vector3(
                    0,
                    3,
                    0
                )
            ),
        damage
    );


    updateUI();


    if (
        enemyData.hp <= 0
    ) {

        enemyData.alive =
            false;


        scene.remove(
            enemy
        );


        document.getElementById(
            "message"
        ).style.display =
            "flex";


        document.getElementById(
            "messageText"
        ).textContent =
            "승리! 🎉";

    }

}


/* =========================================================
   플레이어 피해
========================================================= */

function damagePlayer(
    damage
) {

    if (
        !playerData.alive
    )
        return;


    playerData.hp -=
        damage;


    playerData.hp =
        Math.max(
            0,
            playerData.hp
        );


    showDamageNumber(
        player.position.clone()
            .add(
                new THREE.Vector3(
                    0,
                    3,
                    0
                )
            ),
        damage
    );


    updateUI();


    if (
        playerData.hp <= 0
    ) {

        playerData.alive =
            false;


        document.getElementById(
            "message"
        ).style.display =
            "flex";


        document.getElementById(
            "messageText"
        ).textContent =
            "패배!";

    }

}


/* =========================================================
   데미지 숫자
========================================================= */

function showDamageNumber(
    position,
    damage
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width = 256;
    canvas.height = 128;


    const ctx =
        canvas.getContext("2d");


    ctx.font =
        "bold 48px Arial";


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "white";


    ctx.strokeStyle =
        "black";


    ctx.lineWidth =
        7;


    ctx.strokeText(
        "-" + damage,
        128,
        70
    );


    ctx.fillText(
        "-" + damage,
        128,
        70
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    const material =
        new THREE.SpriteMaterial({
            map: texture,
            transparent: true
        });


    const sprite =
        new THREE.Sprite(
            material
        );


    sprite.position.copy(
        position
    );


    sprite.scale.set(
        2.2,
        1.1,
        1
    );


    scene.add(sprite);


    let time = 0;


    function animateDamage() {

        time += .04;


        sprite.position.y +=
            .025;


        material.opacity =
            1 - time;


        if (
            time < 1
        ) {

            requestAnimationFrame(
                animateDamage
            );

        }
        else {

            scene.remove(
                sprite
            );

            texture.dispose();
            material.dispose();

        }

    }


    animateDamage();

}


/* =========================================================
   적 AI
========================================================= */

function updateEnemy(
    delta
) {

    if (
        !enemyData.alive
    )
        return;


    const direction =
        player.position
            .clone()
            .sub(
                enemy.position
            );


    direction.y = 0;


    const distance =
        direction.length();


    direction.normalize();


    /*
        플레이어 추적
    */

    if (
        distance > 8
    ) {

        enemy.position.add(

            direction
                .multiplyScalar(
                    enemyData.speed *
                    delta
                )

        );

    }


    /*
        플레이어 바라보기
    */

    enemy.rotation.y =
        Math.atan2(
            direction.x,
            direction.z
        );


    /*
        적 공격
    */

    enemyData.shootTimer -=
        delta;


    if (
        enemyData.shootTimer <= 0 &&
        distance < 30
    ) {

        enemyShoot(
            direction
        );


        enemyData.shootTimer =
            1.5;

    }

}


/* =========================================================
   적 공격
========================================================= */

function enemyShoot(
    direction
) {

    /*
        중요:

        owner를 반드시 enemy로 설정한다.

        따라서 이 탄환은
        적에게 피해를 줄 수 없다.
    */

    createProjectile({

        position:
            enemy.position
                .clone()
                .add(
                    new THREE.Vector3(
                        0,
                        1.5,
                        0
                    )
                ),

        direction,

        color: 0xff3333,

        damage:
            DAMAGE.ENEMY,

        speed: 13,

        owner: "enemy",

        size: .32

    });

}


/* =========================================================
   투사체 업데이트
========================================================= */

function updateProjectiles(
    delta
) {

    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            projectiles[i];


        p.mesh.position.add(

            p.direction
                .clone()
                .multiplyScalar(
                    p.speed *
                    delta
                )

        );


        p.life -=
            delta;


        /* =================================
           플레이어 공격
        ================================= */

        if (
            p.owner === "player"
        ) {

            /*
                플레이어 탄환은
                적만 공격한다.
            */

            if (
                enemyData.alive &&
                p.mesh.position
                    .distanceTo(
                        enemy.position
                    ) < 1.5
            ) {

                damageEnemy(
                    p.damage
                );


                removeProjectile(
                    i
                );


                continue;

            }

        }


        /* =================================
           적 공격
        ================================= */

        else if (
            p.owner === "enemy"
        ) {

            /*
                적 탄환은
                플레이어만 공격한다.

                적 자신에게는 절대
                피해를 주지 않는다.
            */

            if (
                playerData.alive &&
                p.mesh.position
                    .distanceTo(
                        player.position
                    ) < 1.5
            ) {

                damagePlayer(
                    p.damage
                );


                removeProjectile(
                    i
                );


                continue;

            }

        }


        /* 수명 */

        if (
            p.life <= 0 ||
            Math.abs(
                p.mesh.position.x
            ) > 40 ||
            Math.abs(
                p.mesh.position.z
            ) > 40
        ) {

            removeProjectile(
                i
            );

        }

    }

}


/* =========================================================
   투사체 삭제
========================================================= */

function removeProjectile(
    index
) {

    const p =
        projectiles[index];


    scene.remove(
        p.mesh
    );


    p.mesh.geometry.dispose();

    p.mesh.material.dispose();


    projectiles.splice(
        index,
        1
    );

}


/* =========================================================
   플레이어 이동
========================================================= */

function updatePlayer(
    delta
) {

    if (
        !playerData.alive
    )
        return;


    const move =
        new THREE.Vector3();


    if (
        keys["w"]
    )
        move.z -= 1;


    if (
        keys["s"]
    )
        move.z += 1;


    if (
        keys["a"]
    )
        move.x -= 1;


    if (
        keys["d"]
    )
        move.x += 1;


    if (
        move.lengthSq() > 0
    ) {

        move.normalize();


        player.position.add(

            move.multiplyScalar(
                playerData.speed *
                delta
            )

        );


        player.rotation.y =
            Math.atan2(
                move.x,
                move.z
            );

    }


    /*
        경기장 제한
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -32,
            32
        );


    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -32,
            32
        );

}


/* =========================================================
   연계 타이머
========================================================= */

function updateCombo(
    delta
) {

    if (
        playerData.combo > 0
    ) {

        playerData.comboTimer -=
            delta;


        if (
            playerData.comboTimer <= 0
        ) {

            playerData.combo =
                0;

            playerData.comboTimer =
                0;

            updateAttackUI();

        }

    }

}


/* =========================================================
   공격 UI
========================================================= */

function updateAttackUI() {

    const attack =
        document.getElementById(
            "attackName"
        );

    const next =
        document.getElementById(
            "nextAttack"
        );


    if (
        playerData.combo === 0
    ) {

        attack.textContent =
            "신발";

        next.textContent =
            "탬버린";

    }

    else if (
        playerData.combo === 1
    ) {

        attack.textContent =
            "탬버린";

        next.textContent =
            "3연속 칼날";

    }

    else {

        attack.textContent =
            "3연속 칼날";

        next.textContent =
            "신발";

    }

}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    const playerPercent =
        playerData.hp /
        playerData.maxHp *
        100;


    document.getElementById(
        "playerBar"
    ).style.width =
        playerPercent + "%";


    document.getElementById(
        "playerHP"
    ).textContent =

        Math.round(
            playerData.hp
        )
        +
        " / "
        +
        playerData.maxHp;


    const enemyPercent =
        enemyData.hp /
        enemyData.maxHp *
        100;


    document.getElementById(
        "enemyBar"
    ).style.width =
        enemyPercent + "%";


    document.getElementById(
        "enemyHP"
    ).textContent =

        Math.round(
            enemyData.hp
        )
        +
        " / "
        +
        enemyData.maxHp;

}


/* =========================================================
   카메라
========================================================= */

function updateCamera() {

    const desired =
        player.position
            .clone()
            .add(
                new THREE.Vector3(
                    0,
                    14,
                    14
                )
            );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        player.position
    );

}


/* =========================================================
   게임 루프
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(
        delta
    );


    updateEnemy(
        delta
    );


    updateProjectiles(
        delta
    );


    updateCombo(
        delta
    );


    updateCamera();


    const comboText =
        document.getElementById(
            "comboTime"
        );


    if (
        playerData.combo > 0
    ) {

        comboText.textContent =
            playerData.comboTimer
                .toFixed(1)
            + "초";

    }
    else {

        comboText.textContent =
            "준비";

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   창 크기 변경
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* 최초 UI */

updateUI();
updateAttackUI();

</script>
